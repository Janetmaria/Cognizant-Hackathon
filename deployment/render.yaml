# Render deployment configuration
# Docs: https://render.com/docs/yaml-spec

services:
  - type: web
    name: retail-forecast-api
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    plan: free
    envVars:
      - key: JWT_SECRET_KEY
        sync: false          # Set manually in Render dashboard — never commit
      - key: GROQ_API_KEY
        sync: false          # Set manually in Render dashboard — optional, /insights
                              # falls back to a template generator if unset (see backend/llm_insights.py)
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "480"
      - key: PYTHON_VERSION
        value: "3.11.0"
